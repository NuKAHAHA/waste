name: Smart Waste Release

on:
  push:
    branches: [main]
    paths:
      - 'research/smart-waste-astana/VERSION'
      - '.github/workflows/smart-waste-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: research/smart-waste-astana
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python main.py demo
      - name: Install optional report authoring tools
        run: python -m pip install python-docx==1.2.0 reportlab==4.4.4
      - name: Export report with actual Windows Times New Roman
        run: python tools/export_report.py
      - run: python tools/build_release.py
      - run: python tools/check_release.py
      - name: Publish immutable version after verification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          if gh release view smart-waste-v1.0.1 >/dev/null 2>&1; then
            echo 'Version 1.0.1 already published; existing release is preserved.'
          else
            gh release create smart-waste-v1.0.1 dist/smart-waste-astana-1.0.1.zip docs/report/Assignment_3_Smart_Waste_Report_RU.pdf --target "$(git rev-parse HEAD)" --title "Smart Waste Astana 1.0.1" --notes "Complete Assignment 3 module and 12-page report with embedded Times New Roman. Five explainable agents, synthetic Astana demo, 30 tests and standalone Windows launch."
          fi

