name: Smart Waste Release

on:
  push:
    branches: [main]
    paths:
      - 'research/smart-waste-astana/VERSION'
      - '.github/workflows/smart-waste-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: research/smart-waste-astana
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python main.py demo
      - run: python tools/build_release.py
      - run: python tools/check_release.py
      - name: Publish immutable version after verification
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          if gh release view smart-waste-v1.0.0 >/dev/null 2>&1; then
            echo 'Version 1.0.0 already published; existing release is preserved.'
          else
            gh release create smart-waste-v1.0.0 dist/smart-waste-astana-1.0.0.zip --target "$RELEASE_TARGET" --title "Smart Waste Astana 1.0.0" --notes "Explainable five-agent research module. Synthetic Astana demo data. See research/smart-waste-astana/README.md for launch instructions and limitations."
          fi

